services:
  exporter:
    image: python:3.12-slim
    command: python3 /app/exporter.py
    working_dir: /app
    volumes:
      - .:/app:ro  # exporter.py imports labels.py and triage.py
    ports:
      - "8000:8000"

  llm-server:  # network link to the server model (Ollama :11434); `docker compose kill llm-server` makes it unreachable
    image: alpine/socat:1.8.0.3
    network_mode: host  # host netns reaches the Windows Ollama on localhost; a dead link refuses at once
    command: TCP-LISTEN:11435,fork,reuseaddr TCP:localhost:11434

  jaeger:  # ponytail: in-memory storage, traces are gone after a restart; add badger storage if they must persist
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP from triage.py

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ci-health.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

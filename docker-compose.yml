services:
  exporter:
    image: python:3.12-slim
    command: python3 /app/exporter.py
    working_dir: /app
    volumes:
      - .:/app:ro  # exporter.py imports labels.py and triage.py
    ports:
      - "8000:8000"

  llm-server:  # link to the self-hosted model; `docker compose kill llm-server` cuts it (failover_test.py)
    image: alpine/socat:1.8.0.3
    network_mode: host  # host netns reaches the SSH tunnel on localhost
    # :11436 = `ssh -N -L 11436:localhost:11434 tuwai@<VM_IP>` to the GCP VM; LLM_SERVER_TARGET=localhost:11434 for local Ollama
    command: TCP-LISTEN:11435,fork,reuseaddr TCP:${LLM_SERVER_TARGET:-localhost:11436}

  watcher:  # polls Prow every 5 min and triages new failures (triage.py watch)
    image: python:3.12-slim
    network_mode: host  # same localhost as the host: llm-server :11435, Jaeger :4318
    working_dir: /app
    volumes:
      - .:/app  # writes data/failures, data/serve.jsonl, data/watch.json
    environment:
      - OPENROUTER_API_KEY  # passed through from the shell running `docker compose up`; never written here
      - PYTHONUNBUFFERED=1
    # ponytail: pip install on every start (~10 s); build an image if that ever matters
    command: sh -c "pip install -q --root-user-action=ignore -r requirements.txt && python3 triage.py watch"
    restart: unless-stopped

  jaeger:  # ponytail: in-memory storage, traces are gone after a restart; add badger storage if they must persist
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP from triage.py

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ci-health.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
